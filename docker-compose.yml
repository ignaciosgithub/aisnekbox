services:
  aisnekbox:
    build: .
    image: aisnekbox
    ports:
      - "8060:8060"
    # NsJail creates user/mount/network namespaces, which requires elevated
    # privileges. `--ipc=none` keeps the container's IPC namespace isolated.
    privileged: true
    ipc: none
    init: true
    restart: unless-stopped
    environment:
      AISNEKBOX_HOST: 0.0.0.0
      AISNEKBOX_PORT: 8060
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8060/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
