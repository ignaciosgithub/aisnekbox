# NsJail configuration for aisnekbox (protobuf text format).
#
# This file was written from scratch using the documented sandbox requirements
# (time/memory/process limits, no networking, read-only system filesystem, a
# writable working directory) and the NsJail `config.proto` reference at
# https://github.com/google/nsjail/blob/master/config.proto
#
# The writable working directory is bind-mounted at runtime via the
# `--bindmount <host>:/home` command-line flag; the resource limits below are
# overridden per-request by aisnekbox from its validated settings.

name: "aisnekbox"
description: "Isolated, network-less Python execution jail for aisnekbox."

mode: ONCE
hostname: "aisnekbox"
cwd: "/home"

# Wall-time guard (also enforced by the supervising process).
time_limit: 20

# Run the jailed process unprivileged with no ability to gain privileges.
keep_caps: false
disable_no_new_privs: false
skip_setsid: false

# A minimal, predictable environment. No host environment is inherited.
keep_env: false
envar: "HOME=/home"
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
# The /etc/ld.so.cache is not exposed inside the jail, so make the linker
# search the directory where the (source-built / official-image) interpreter
# keeps its shared library. Harmless on hosts that ship Python under /usr.
envar: "LD_LIBRARY_PATH=/usr/local/lib:/usr/lib:/lib"
envar: "LANG=C.UTF-8"
envar: "LC_ALL=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONUNBUFFERED=1"
envar: "PYTHONNOUSERSITE=1"

# Seccomp-bpf syscall filter (kafel policy), as defence-in-depth on top of the
# namespaces and dropped capabilities. The default action is ALLOW so the
# CPython interpreter runs unimpeded, while syscalls that have no legitimate use
# for sandboxed user code are denied:
#   * socket creation returns EPERM (network is already cut by the empty netns;
#     this also blocks AF_UNIX / AF_NETLINK kernel attack surface).
#   * kernel-/host-altering and introspection syscalls are hard-killed. They
#     should never appear in well-behaved code, so termination is preferable to
#     a recoverable error.
# Violations are logged by NsJail for auditability.
seccomp_log: true
seccomp_string: "POLICY aisnekbox { "
                "  ERRNO(1) { socket, socketpair }, "
                "  KILL { "
                "    ptrace, process_vm_readv, process_vm_writev, "
                "    mount, umount, pivot_root, chroot, "
                "    swapon, swapoff, reboot, kexec_load, kexec_file_load, "
                "    init_module, finit_module, delete_module, "
                "    add_key, keyctl, request_key, "
                "    bpf, setns, unshare, perf_event_open, "
                "    settimeofday, clock_settime, adjtimex "
                "  } "
                "} "
                "USE aisnekbox DEFAULT ALLOW"

# Resource limits (MiB / seconds where applicable). Overridden per request.
rlimit_as: 128
rlimit_as_type: VALUE
rlimit_cpu: 10
rlimit_cpu_type: VALUE
rlimit_fsize: 32
rlimit_fsize_type: VALUE
rlimit_nofile: 64
rlimit_nofile_type: VALUE
rlimit_nproc: 1
rlimit_nproc_type: VALUE
rlimit_stack: 8
rlimit_stack_type: VALUE
rlimit_core: 0
rlimit_core_type: VALUE

# Isolate everything. clone_newnet with no interface => no network access.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Map the in-jail root user to the (unprivileged) invoking user so that files
# written to the bind-mounted work dir are readable back by the supervisor.
uidmap {
  inside_id: "0"
  outside_id: ""
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: ""
  count: 1
}

mount_proc: false

# Read-only view of the system needed to run the interpreter. Each mount is
# nosuid/nodev; none are writable. `mandatory: false` lets the same config work
# across distributions that differ in which top-level dirs exist.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/etc/alternatives"
  dst: "/etc/alternatives"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/etc/ssl/certs"
  dst: "/etc/ssl/certs"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}

# Minimal device nodes.
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
  nosuid: true
  nodev: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}

# A small private scratch space, separate from the returned work dir.
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
  options: "size=16777216"
}
